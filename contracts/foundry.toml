[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["../node_modules", "node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
chain_id = 10143
network = "monad"
hardfork = "monad:MonadNine"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
auto_detect_remappings = false
remappings = ["@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/"]

[profile.default.fuzz]
runs = 256

[profile.ci.fuzz]
runs = 1000
seed = "0x10143"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC_URL}"

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = true

[profile.ci.invariant]
runs = 256
depth = 128
fail_on_revert = true
