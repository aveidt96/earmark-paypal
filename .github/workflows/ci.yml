name: Earmark PayPal CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run setup:contracts
      - name: fmt-guard
        run: npx prettier --check web/src/server/paypal/search/guard.ts
      - name: fmt-page-fetch
        if: always()
        run: npx prettier --check web/src/server/paypal/search/page-fetch.ts
      - name: fmt-grounding
        if: always()
        run: npx prettier --check web/src/server/paypal/search/grounding.ts
      - name: fmt-verify
        if: always()
        run: npx prettier --check web/src/server/paypal/search/verify.ts
      - name: fmt-offer-discovery
        if: always()
        run: npx prettier --check web/src/server/paypal/offer-discovery.ts
      - name: fmt-test
        if: always()
        run: npx prettier --check web/test/search-pipeline.test.ts
      - name: fmt-handoff
        if: always()
        run: npx prettier --check HANDOFF-PAYPAL.md
      - name: fmt-chat
        if: always()
        run: npx prettier --check web/src/components/purchasing-chat.tsx
      - name: fmt-lib
        if: always()
        run: npx prettier --check web/src/lib/offer-discovery.ts
      - name: fmt-public-research
        if: always()
        run: npx prettier --check web/src/server/paypal/public-research.ts
      - name: lint
        if: always()
        run: npm run lint
      - name: typecheck
        if: always()
        run: npm run typecheck
      - name: test
        if: always()
        run: npm test
      - name: build
        if: always()
        run: npm run build
